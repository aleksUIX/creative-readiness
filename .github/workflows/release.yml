name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Match tag to workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI and MCP server
        run: cargo build --release --locked -p creative-readiness-cli -p creative-readiness-mcp
      - name: Check CLI binary
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          "./target/release/creative-readiness${suffix}" --version
      - name: Package binaries and schemas
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target=$(rustc -vV | sed -n 's/^host: //p')
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          mkdir -p stage dist
          cp "target/release/creative-readiness${suffix}" stage/
          cp "target/release/creative-readiness-mcp${suffix}" stage/
          cp LICENSE README.md stage/
          cp -R packs schemas stage/
          tar -czf "dist/creative-readiness-${RELEASE_TAG}-${target}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --generate-notes --prerelease
          fi
