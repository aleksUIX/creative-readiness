[package]
name = "creative-readiness-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP server for creative-readiness (evaluate, lookup, diff, policy discovery)"
repository.workspace = true

[[bin]]
name = "creative-readiness-mcp"
path = "src/main.rs"

[dependencies]
creative-readiness-core.workspace = true
creative-readiness-probe.workspace = true
vastlint-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
